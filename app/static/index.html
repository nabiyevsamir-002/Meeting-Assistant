<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet Köməkçisi — Künc Paneli</title>
<style>
  /* ============ Meet Köməkçisi — v5 (iki sütun + şüşə xülasə) ============ */
  :root {
    --bg:#04050c; --bg2:#0a0e20;
    --card:rgba(255,255,255,.055); --card-solid:rgba(20,26,52,.66); --field:rgba(255,255,255,.045);
    --text:#f3f4fc; --muted:#a2a8cc; --faint:#6b7299;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.15);
    --i1:#6d6cf7; --i2:#b45cff; --lav:#bcc3ff; --cyan:#5ac8fa;
    --green:#3ddc97; --red:#ff6b81; --amber:#ffcf5c;
    --grad:linear-gradient(135deg,var(--i1) 0%,var(--i2) 100%);
    --spec:inset 0 1px 0 rgba(255,255,255,.22);
    --shadow:0 2px 6px rgba(0,0,0,.35), 0 26px 64px -24px rgba(0,0,0,.85);
    --glow:0 0 0 1px rgba(120,120,255,.25), 0 14px 44px -12px rgba(120,110,255,.55);
    --blur:blur(30px) saturate(185%);
    --radius:22px;
  }
  * { box-sizing:border-box; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:99px; border:2px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.18); background-clip:padding-box; }
  body {
    margin:0; color:var(--text); min-height:100vh; font-size:14px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased; padding:16px;
    background:
      radial-gradient(1200px 600px at 12% -10%, rgba(109,108,247,.30), transparent 60%),
      radial-gradient(1000px 520px at 112% 2%, rgba(180,92,255,.22), transparent 55%),
      radial-gradient(950px 720px at 62% 118%, rgba(90,200,250,.15), transparent 58%),
      var(--bg);
    background-attachment:fixed;
  }

  /* --- Brend başlığı --- */
  .brand { display:flex; align-items:center; gap:12px; margin:2px 2px 16px; }
  /* Siri-üslublu canlı orb */
  .brand .siri {
    width:46px; height:46px; border-radius:50%; flex:none; position:relative;
    background:
      radial-gradient(circle at 32% 26%, #d8e4ff 0%, transparent 42%),
      conic-gradient(from 200deg, #6d6cf7, #5ac8fa, #b45cff, #6d6cf7);
    box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 10px 26px -6px rgba(120,110,255,.75),
      inset 0 -6px 12px rgba(0,0,0,.4);
    animation:siriHue 7s linear infinite, siriPulse 3.2s ease-in-out infinite;
  }
  .brand .siri::after {
    content:""; position:absolute; inset:6px; border-radius:50%;
    background:radial-gradient(circle at 42% 32%, rgba(255,255,255,.55), transparent 46%);
    mix-blend-mode:screen;
  }
  @keyframes siriHue { to { filter:hue-rotate(360deg); } }
  @keyframes siriPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.055);} }
  .brand h1 { font-size:18px; font-weight:800; margin:0; letter-spacing:-.2px; }
  .brand .sub { color:var(--muted); font-size:12px; margin:2px 0 0; }

  /* --- Kartlar --- */
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:13px; box-shadow:var(--shadow), var(--spec);
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  }
  .row { display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
  label.lbl { font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
              color:var(--faint); display:block; margin:0 0 6px 2px; }
  input[type=text] {
    padding:10px 12px; border-radius:11px; border:1px solid var(--line2);
    background:var(--field); color:var(--text); font-size:14px; outline:none; flex:1; min-width:120px;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus { border-color:var(--i1); box-shadow:0 0 0 4px rgba(99,102,241,.18); }
  input[type=file] { color:var(--muted); font-size:12px; flex:1; min-width:120px; }
  input[type=file]::file-selector-button {
    margin-right:9px; padding:7px 12px; border-radius:9px; border:1px solid var(--line2);
    background:var(--field); color:var(--text); font-weight:700; font-size:12px; cursor:pointer;
  }
  button {
    padding:10px 15px; border:none; border-radius:11px; cursor:pointer; font-weight:700;
    font-size:13px; color:#fff; background:var(--grad); box-shadow:var(--glow);
    transition:transform .12s, box-shadow .12s, filter .12s; white-space:nowrap;
  }
  button:hover { transform:translateY(-1px); filter:brightness(1.06); }
  button:active { transform:translateY(0); }
  button.ghost { background:rgba(255,255,255,.04); color:var(--text); border:1px solid var(--line2); box-shadow:none; }
  button.ghost:hover { border-color:var(--lav); color:#fff; background:rgba(255,255,255,.07); }
  button.danger { background:rgba(251,113,133,.12); color:var(--red); border:1px solid rgba(251,113,133,.35); box-shadow:none; }
  button.danger:hover { background:rgba(251,113,133,.2); }

  /* Cavab rejimi keçidi (segmentli) */
  .modes { display:flex; gap:6px; background:var(--field); border:1px solid var(--line2);
           border-radius:11px; padding:4px; margin-bottom:11px; }
  .modes .mode { flex:1; background:transparent; color:var(--muted); box-shadow:none;
                 font-size:12px; padding:8px 10px; border-radius:8px; }
  .modes .mode:hover { transform:none; color:var(--text); }
  .modes .mode.on { background:var(--grad); color:#fff; box-shadow:var(--glow); }

  /* --- Status zolağı --- */
  .status { font-size:12.5px; color:var(--muted); line-height:1.5; display:flex; align-items:center; gap:8px; }
  .status b { color:var(--text); font-weight:700; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--faint); flex:none; }
  .dot.on { background:var(--green); box-shadow:0 0 0 4px rgba(52,211,153,.18), 0 0 10px var(--green); }

  /* --- Canlı iş sahəsi (PiP-ə köçürülür) --- */
  #stack { position:relative; display:flex; flex-direction:column; gap:12px; }

  /* Canlı zolaq: status + sayğaclar + xülasə düyməsi */
  .livebar { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:13px;
    padding:10px 14px; box-shadow:var(--shadow); backdrop-filter:blur(14px); }
  .livebar .live { color:var(--green); font-weight:800; letter-spacing:.6px; font-size:11px;
    display:inline-flex; align-items:center; gap:7px; }
  .livebar .live::before { content:""; width:8px; height:8px; border-radius:50%;
    background:var(--green); box-shadow:0 0 10px var(--green); animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.8);} }
  .livebar .meta { font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:5px; }
  .livebar .meta i { font-style:normal; opacity:.75; }
  .livebar .meta b { color:var(--text); font-weight:800; }
  .livebar .meta.hot b { color:var(--red); }
  .livebar .sum-btn { margin-left:auto; cursor:pointer; color:var(--lav); font-weight:800;
    background:rgba(165,180,252,.1); border:1px solid rgba(165,180,252,.25);
    border-radius:999px; font-size:12px; padding:7px 14px; box-shadow:none; }
  .livebar .sum-btn:hover { background:rgba(165,180,252,.2); transform:none; }

  /* İki sütun düzülüşü */
  .grid2 { display:grid; grid-template-columns:1fr; gap:12px; }
  .qa-col { order:-1; }               /* dar ekran / PiP: cavablar öndə */
  @media (min-width:640px) {
    .grid2 { grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); align-items:start; }
    .transcript-col { order:0; }      /* geniş: transkript solda */
    .qa-col { order:1; }              /* suallar sağda */
  }
  .col { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); backdrop-filter:blur(14px); overflow:hidden; }
  .colhead { display:flex; align-items:center; gap:8px; padding:11px 14px;
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
    color:var(--faint); border-bottom:1px solid var(--line); }
  .colhead .ico { font-size:14px; }
  .colhead .cnt { margin-left:auto; background:var(--field); color:var(--muted);
    border-radius:999px; padding:2px 9px; font-size:10.5px; letter-spacing:0; }

  /* Canlı transkript */
  .tbody { padding:10px 12px; display:flex; flex-direction:column; gap:7px;
    max-height:62vh; overflow-y:auto; }
  .tline { font-size:13px; line-height:1.5; color:var(--muted); padding:6px 10px;
    border-radius:9px; background:rgba(255,255,255,.02); border:1px solid transparent;
    animation:slidein .25s ease; }
  .tline.now { color:var(--text); background:rgba(99,102,241,.1); border-color:rgba(99,102,241,.25); }
  .thint { color:var(--faint); font-size:12.5px; text-align:center; padding:30px 14px; line-height:1.6; }

  /* Q&A gövdəsi */
  .qbody { padding:12px; display:flex; flex-direction:column; gap:12px; }

  /* Sual kartları */
  .q { position:relative; background:var(--card-solid); border:1px solid var(--line);
    border-radius:15px; padding:14px 15px 13px; box-shadow:var(--shadow);
    animation:slidein .32s cubic-bezier(.2,.8,.2,1); transition:transform .15s; }
  .q:hover { transform:translateY(-2px); }
  .q::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px;
               border-radius:3px; background:var(--i2); }
  .q.urgent { box-shadow:var(--shadow), 0 0 0 1px rgba(251,113,133,.25); }
  .q.urgent::before { background:linear-gradient(var(--red),#f43f5e); box-shadow:0 0 12px rgba(251,113,133,.6); }
  .q.plain { opacity:.94; }
  .q.plain::before { background:var(--line2); }
  .q.plain .tag { color:var(--faint); }
  .q .tag { font-size:10px; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
            color:var(--lav); margin-bottom:7px; display:flex; gap:7px; align-items:center; }
  .q .tag .b { background:rgba(251,113,133,.16); color:var(--red); padding:2px 9px;
               border-radius:999px; font-size:9.5px; letter-spacing:.4px; }
  .q .qt { font-size:15px; font-weight:700; line-height:1.45; margin-bottom:10px; letter-spacing:-.1px; }

  .wait { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:12.5px; padding:3px 0; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--line2);
          border-top-color:var(--i2); animation:rot .8s linear infinite; flex:none; }
  @keyframes rot { to { transform:rotate(360deg); } }

  /* Cavab (streaming / variant) */
  .opt { position:relative; background:var(--field); border:1px solid var(--line2);
    border-radius:12px; padding:10px 12px; margin-top:8px; font-size:13.5px;
    line-height:1.55; cursor:pointer; transition:border-color .15s, background .15s, transform .12s; }
  .opt:hover { border-color:var(--i1); background:rgba(99,102,241,.08); transform:translateX(2px); }
  .opt .tone { display:inline-block; font-size:9.5px; font-weight:800; text-transform:uppercase;
               letter-spacing:.5px; color:var(--green); margin-right:8px;
               background:rgba(52,211,153,.12); padding:2px 8px; border-radius:999px; }
  .opt .ctx { display:block; font-size:10.5px; color:var(--muted); margin-top:5px; }
  .opt .ctx.ready { color:var(--green); }
  .opt.copied { border-color:var(--green); background:rgba(52,211,153,.1); }
  .opt.copied::after { content:"Kopyalandı ✓"; position:absolute; top:9px; right:11px;
                       font-size:10px; font-weight:800; color:var(--green); }
  .opt.stream { border-color:rgba(99,102,241,.35); }
  .cursor { display:inline-block; width:7px; height:15px; margin-left:2px; vertical-align:-2px;
            background:var(--i2); border-radius:2px; animation:blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* I: status axını + F: sürət nişanı */
  .tl { display:flex; gap:6px; align-items:center; margin:1px 0 11px; flex-wrap:wrap; }
  .tl .st { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px;
            color:var(--faint); padding:3px 9px; border-radius:999px; background:var(--line);
            display:inline-flex; align-items:center; gap:5px; transition:.2s; }
  .tl .st::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--line2); }
  .tl .st.active { color:var(--lav); background:rgba(165,180,252,.14); }
  .tl .st.active::before { background:var(--lav); animation:pulse 1s infinite; }
  .tl .st.done { color:var(--green); background:rgba(52,211,153,.12); }
  .tl .st.done::before { content:"✓"; width:auto; height:auto; background:none; color:var(--green); font-size:9px; font-weight:900; }
  .spd { color:var(--green); font-weight:900; letter-spacing:0; }

  /* H: canlı "dinləyirəm" vəziyyəti */
  .listening { text-align:center; padding:30px 16px; animation:fade .4s; }
  .listening .ear { font-size:32px; animation:bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .listening .lt { font-size:14px; font-weight:800; color:var(--text); margin-top:8px;
                   display:flex; align-items:center; justify-content:center; gap:2px; }
  .listening .dots { display:inline-flex; gap:3px; margin-left:3px; }
  .listening .dots i { width:4px; height:4px; border-radius:50%; background:var(--lav);
                       display:inline-block; animation:bounce 1.2s infinite; }
  .listening .dots i:nth-child(2) { animation-delay:.2s; }
  .listening .dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes bounce { 0%,100%{opacity:.3;transform:translateY(0);} 50%{opacity:1;transform:translateY(-3px);} }
  .listening .ls { font-size:11.5px; margin-top:9px; color:var(--faint); line-height:1.5; }

  /* --- Şüşə xülasə örtüyü ("Söhbətin gedişatı") --- */
  .glass-ov { position:fixed; inset:0; z-index:9998; display:flex;
    align-items:center; justify-content:center; padding:22px;
    background:rgba(7,11,26,.5); animation:fade .18s ease; }
  .glass-card { width:min(440px,94%);
    background:rgba(26,33,60,.5);
    border:1px solid rgba(255,255,255,.16); border-radius:20px; padding:18px 20px;
    box-shadow:0 24px 70px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.14);
    backdrop-filter:blur(30px) saturate(180%); -webkit-backdrop-filter:blur(30px) saturate(180%);
    animation:glassin .28s cubic-bezier(.2,.9,.2,1); }
  @keyframes glassin { from{opacity:0; transform:translateY(-14px) scale(.97);} to{opacity:1; transform:none;} }
  .gc-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
    font-size:13px; font-weight:800; color:var(--lav); }
  .gc-x { background:rgba(255,255,255,.08); border:1px solid var(--line2); color:var(--text);
    border-radius:9px; width:30px; height:30px; padding:0; box-shadow:none; font-size:13px; }
  .gc-x:hover { background:rgba(255,255,255,.15); transform:none; }
  .gc-body { font-size:14.5px; line-height:1.65; color:var(--text); }
  .gc-foot { margin-top:12px; padding-top:11px; border-top:1px solid rgba(255,255,255,.1);
    font-size:11.5px; color:var(--muted); line-height:1.5; }

  @keyframes slidein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }

  /* --- Drag-and-drop --- */
  .dz-hint { color:var(--faint); font-size:11px; margin-left:2px; }
  #dropzone { position:fixed; inset:0; z-index:99999; display:none;
    align-items:center; justify-content:center; padding:24px;
    background:rgba(7,11,26,.82); backdrop-filter:blur(8px) saturate(140%); animation:fade .15s ease; }
  #dropzone.on { display:flex; }
  #dropzone .dz-inner { border:2.5px dashed var(--i1); border-radius:22px; padding:44px 56px; text-align:center;
    background:linear-gradient(135deg, rgba(99,102,241,.12), rgba(168,85,247,.1));
    color:var(--lav); font-weight:800; font-size:16px; box-shadow:var(--glow);
    transform:scale(.98); animation:pop .15s ease forwards; }
  #dropzone .dz-inner .big { display:block; font-size:44px; margin-bottom:12px; }
  #dropzone .dz-inner small { display:block; color:var(--muted); font-weight:600; font-size:12px; margin-top:8px; }
  @keyframes pop { to { transform:scale(1); } }

  /* --- Mərhələ göstəriciləri (sənəd emalı + iclas-sonrası) --- */
  #ingest:empty, #postbar:empty { display:none; }
  #postbar .ingest { margin-top:0; margin-bottom:12px; }
  .ingest { margin-top:12px; background:var(--field); border:1px solid var(--line2);
    border-radius:13px; padding:12px 14px; animation:slidein .25s ease; }
  .ingest .ih { font-size:12px; font-weight:800; color:var(--lav); margin-bottom:10px;
    display:flex; align-items:center; gap:8px; }
  .ingest .ih.ok { color:var(--green); }
  .ingest ol { list-style:none; margin:0; padding:0; }
  .ingest li { position:relative; display:flex; align-items:center; gap:10px;
    padding:5px 0; font-size:12.5px; color:var(--faint); transition:color .2s; }
  .ingest li .ic { width:20px; height:20px; border-radius:50%; flex:none; display:grid;
    place-items:center; border:2px solid var(--line2); font-size:11px; font-weight:900;
    color:var(--faint); background:var(--bg2); z-index:1; transition:.2s; }
  .ingest li:not(:last-child)::before { content:""; position:absolute; left:9px; top:24px;
    bottom:-5px; width:2px; background:var(--line2); }
  .ingest li.done { color:var(--text); }
  .ingest li.done .ic { border-color:var(--green); background:rgba(52,211,153,.16); color:var(--green); }
  .ingest li.done:not(:last-child)::before { background:var(--green); }
  .ingest li.active { color:var(--text); }
  .ingest li.active .ic { border-color:var(--lav); }
  .ingest li.err .ic { border-color:var(--red); color:var(--red); background:rgba(251,113,133,.14); }
  .ingest li .sp { width:11px; height:11px; border-radius:50%; border:2px solid var(--line2);
    border-top-color:var(--lav); animation:rot .8s linear infinite; }
  .ingest li em { color:var(--muted); font-style:normal; font-size:11px; margin-left:auto;
    background:var(--line); padding:2px 9px; border-radius:999px; }

  /* Bildiriş düyməsi aktiv */
  button.ghost.on { border-color:var(--lav); color:#fff; background:rgba(165,180,252,.16); }

  /* --- İclas tarixçəsi örtüyü --- */
  #history:empty { display:none; }
  .hist-ov { position:fixed; inset:0; z-index:9997; display:flex; flex-direction:column;
    padding:20px; background:rgba(7,11,26,.72); backdrop-filter:blur(6px); animation:fade .18s ease; }
  .hist-card { width:min(760px,100%); margin:0 auto; flex:1; min-height:0; display:flex; flex-direction:column;
    background:var(--card-solid); border:1px solid var(--line2); border-radius:20px;
    box-shadow:0 24px 70px -20px rgba(0,0,0,.85), var(--spec); overflow:hidden;
    backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); }
  .hist-head { display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line); }
  .hist-head h2 { font-size:15px; font-weight:800; margin:0; flex:none; }
  .hist-head input { flex:1; }
  .hist-x { flex:none; background:rgba(255,255,255,.06); border:1px solid var(--line2); color:var(--text);
    border-radius:10px; width:34px; height:34px; padding:0; box-shadow:none; }
  .hist-x:hover { background:rgba(255,255,255,.14); transform:none; }
  .hist-body { flex:1; min-height:0; overflow-y:auto; padding:14px 18px; }

  .hrow { display:flex; align-items:center; gap:12px; padding:12px 13px; margin-bottom:9px;
    background:var(--field); border:1px solid var(--line); border-radius:13px; cursor:pointer;
    transition:border-color .15s, transform .12s; }
  .hrow:hover { border-color:var(--i1); transform:translateX(2px); }
  .hrow .ht { font-size:14px; font-weight:700; }
  .hrow .hm { font-size:11.5px; color:var(--muted); margin-top:2px; }
  .hrow .hchev { margin-left:auto; color:var(--faint); font-size:16px; }
  .hempty { text-align:center; color:var(--muted); padding:40px 16px; font-size:13px; line-height:1.6; }

  /* Hesabat detalı */
  .hback { background:rgba(255,255,255,.05); border:1px solid var(--line2); color:var(--lav);
    box-shadow:none; font-size:12px; padding:7px 13px; margin-bottom:14px; }
  .hback:hover { transform:none; background:rgba(255,255,255,.09); }
  .hsec { margin-bottom:18px; }
  .hsec h3 { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
    color:var(--lav); margin:0 0 9px; }
  .hsec .headline { font-size:16px; font-weight:800; margin-bottom:6px; }
  .hsec .overview { font-size:13.5px; color:var(--text); line-height:1.6; }

<script>
/* İki sütunlu panel: solda canlı transkript, sağda suallar/cavablar.
   Şüşə "Söhbətin gedişatı" örtüyü düymə ilə açılır.
   Document Picture-in-Picture ilə panel bütün pəncərələrin (Meet daxil) üstündə qalır. */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g,
  (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");

let meeting = null;          // canlı iclas
let lastId = 0;              // feed kursoru
let lastHeard = "";          // son transkript
let transcript = [];         // sol sütun: bütün eşidilən sətirlər
const items = new Map();     // norm(sual) -> {q, directed, streamText, done, ...}
let stats = { segments: 0, questions: 0, directed: 0, startedAt: null };
let quickSummary = "";       // son sürətli xülasə (şüşə kart)
let cmuVisible = false;      // şüşə xülasə örtüyü açıqdır?
let ingestState = null;      // sənəd yükləmə mərhələsi (stepper)
let postState = null;        // iclas-sonrası pipeline mərhələsi (stepper)
let notifyOn = localStorage.getItem("notify") === "on";  // masaüstü bildiriş
let historyOpen = false;     // tarixçə örtüyü açıqdır?
let historyList = [];        // keçmiş iclaslar
let historyDetail = null;    // baxılan hesabat detalı
let historySearch = "";      // tarixçə axtarış sözü
let token = localStorage.getItem("token") || null;  // prod giriş token-i
let captureStream = null, capturing = false;  // sekme səsi tutması
let vadTimer = null, vadCtx = null;           // VAD (pauzada kəsmə)
let postAnim = null, ingestAnim = null;    // mərhələ animatorları
let ingestedDocs = [];                     // bilik bazasına yüklənmiş sənədlər (davamlı təsdiq)
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function setLive(on) { document.body.classList.toggle("live", !!on); }

function attachMeeting(m) {
  meeting = m;
  setLive(true);
  lastId = 0;
  items.clear();
  transcript = [];
  quickSummary = "";
  cmuVisible = false;
  stats = {
    segments: 0, questions: 0, directed: 0,
    startedAt: m.started_at ? Date.parse(m.started_at) : Date.now(),
  };
  render();
}

function setStatus(html, on) {
  $("status").innerHTML = `<span class="dot ${on ? "on" : ""}"></span>` + html;
}

async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers,
    token ? { "Authorization": "Bearer " + token } : {});
  const r = await fetch(path, opts);
  if (r.status === 401) { $("login").style.display = "flex"; throw new Error("giriş tələb olunur"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}

/* --- Giriş (prod-da AUTH_ENABLED=true olduqda) --- */
async function doLogin() {
  const err = $("loginErr"); if (err) err.textContent = "";
  try {
    const d = await api("/api/auth/token", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("lu").value, password: $("lp").value }),
    });
    token = d.access_token;
    localStorage.setItem("token", token);
    localStorage.setItem("username", $("lu").value);
    $("login").style.display = "none";
    location.reload();
  } catch (e) {
    if (err) err.textContent = "İstifadəçi adı və ya şifrə yanlışdır";
  }
}

/* --- Brauzer mikrofonu ilə səs tutma (canlı iclas üçün, xarici agent lazım deyil) --- */
function pickMime() {
  const opts = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
  for (const m of opts) { try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; } catch (_) {} }
  return "";
}
// ① Meet sekmesinin səsini tuturuq (mikrofonu YOX) — beləliklə yalnız qarşı tərəf
//    eşidilir, siz yox; həm də səs təmiz rəqəmsaldır (otaq küyü/əks-səda olmadan).
async function acquireCaptureStream() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) {
    setStatus("🎧 Bu brauzer sekme səsi tutmasını dəstəkləmir — Chrome/Edge işlədin", false);
    return false;
  }
  try {
    // Chrome sekme səsini yalnız video ilə birlikdə təklif edir — videonu alıb sonra atırıq
    const s = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    const at = s.getAudioTracks();
    if (!at.length) {
      s.getTracks().forEach((t) => t.stop());
      setStatus("🔇 Səs paylaşılmadı — yenidən «Başlat» basıb Meet sekmesini seçin və «Səsi də paylaş»-ı işarələyin", false);
      return false;
    }
    s.getVideoTracks().forEach((t) => t.stop());   // yalnız səs lazımdır
    captureStream = new MediaStream(at);
    at[0].addEventListener("ended", () => stopCapture());  // istifadəçi paylaşımı dayandırsa
    return true;
  } catch (e) {
    setStatus("🎧 Səs mənbəyi seçilmədi — iclas başladı, amma səs tutulmur", false);
    return false;
  }
}

function uploadChunk(id, blob) {
  if (!blob || blob.size < 1400 || !meeting || meeting.id !== id) return;
  const fd = new FormData();
  fd.append("file", blob, "chunk.webm");   // endpoint sahə adı: file
  fetch(`/api/meetings/${id}/segments/audio`, {
    method: "POST", headers: token ? { "Authorization": "Bearer " + token } : {}, body: fd,
  }).catch(() => { /* şəbəkə xətası — növbəti parça davam edir */ });
}

// ② Pauzada kəsmə (VAD): adam susanda parçanı bağlayırıq → hər parça TAM cümlə
//    olur, söz ortadan bölünmür. VAD qurula bilməsə 8s-lik sadə rejimə keçir.
function beginRecording(id) {
  if (capturing || !captureStream) return;
  capturing = true;
  const mime = pickMime();
  const mk = () => { try { return mime ? new MediaRecorder(captureStream, { mimeType: mime }) : new MediaRecorder(captureStream); } catch (_) { return null; } };

  let analyser = null, data = null;
  try {
    vadCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = vadCtx.createMediaStreamSource(captureStream);
    analyser = vadCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    data = new Uint8Array(analyser.fftSize);
  } catch (_) { analyser = null; }

  if (!analyser) {   // ehtiyat: sadə 8s parçalar (5s-dən böyük → daha az kəsim)
    const loop = () => new Promise((resolve) => {
      const rec = mk(); if (!rec) { resolve(); return; }
      const p = [];
      rec.ondataavailable = (e) => { if (e.data && e.data.size) p.push(e.data); };
      rec.onstop = () => { uploadChunk(id, new Blob(p, { type: rec.mimeType || "audio/webm" })); resolve(); };
      try { rec.start(); } catch (_) { resolve(); return; }
      setTimeout(() => { try { if (rec.state !== "inactive") rec.stop(); } catch (_) {} }, 8000);
    });
    (async () => { while (capturing) { await loop(); } })();
    return;
  }

  const ON = 0.012, SILENCE_MS = 800, MIN_MS = 900, MAX_MS = 14000;
  let rec = null, silenceStart = 0, chunkStart = 0;
  const startRec = () => {
    const r = mk(); if (!r) { rec = null; return; }
    const p = [];
    r.ondataavailable = (e) => { if (e.data && e.data.size) p.push(e.data); };
    r.onstop = () => { uploadChunk(id, new Blob(p, { type: r.mimeType || "audio/webm" })); };
    try { r.start(); chunkStart = performance.now(); rec = r; } catch (_) { rec = null; }
  };
  const stopRec = () => { const r = rec; rec = null; try { if (r && r.state !== "inactive") r.stop(); } catch (_) {} };

  const tick = () => {
    if (!capturing) { stopRec(); try { vadCtx && vadCtx.close(); } catch (_) {} vadCtx = null; return; }
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) { const v = (data[i] - 128) / 128; sum += v * v; }
    const rms = Math.sqrt(sum / data.length);
    const now = performance.now();
    if (rms > ON) {
      silenceStart = 0;
      if (!rec) startRec();                                          // nitq başladı → yeni parça
      else if (now - chunkStart > MAX_MS) { stopRec(); startRec(); } // çox uzun → böl
    } else if (rec) {
      if (!silenceStart) silenceStart = now;
      if (now - silenceStart > SILENCE_MS && now - chunkStart > MIN_MS) stopRec();  // cümlə bitdi
    }
    vadTimer = setTimeout(tick, 100);
  };
  tick();
}

function stopCapture() {
  capturing = false;
  if (vadTimer) { clearTimeout(vadTimer); vadTimer = null; }
  if (vadCtx) { try { vadCtx.close(); } catch (_) {} vadCtx = null; }
  if (captureStream) { captureStream.getTracks().forEach((t) => t.stop()); captureStream = null; }
}

/* --- Mərhələ animatoru: addımları həmişə bir-bir, hamar sürətlə doldurur
   (backend nə qədər sürətli olsa da UI tullanmır) --- */
function startPacer(get, render, stepMs, onDone) {
  const t = setInterval(() => {
    const st = get();
    if (!st) { clearInterval(t); return; }
    if (st.error) { clearInterval(t); render(); return; }
    const cap = st.done ? st.total : st.target;   // done olana qədər son addımı doldurmuruq
    if (st.shown < cap) { st.shown++; render(); }
    else if (st.done && st.shown >= st.total) { clearInterval(t); render(); if (onDone) onDone(); }
  }, stepMs);
  return t;
}

/* --- İclas idarəsi --- */
async function findLive() {
  const list = await api("/api/meetings");
  return list.find((m) => m.status === "live") || null;
}

$("startBtn").onclick = async () => {
  // ① Səs mənbəyini DƏRHAL al (istifadəçi jesti təzə ikən): Meet sekmesinin səsi
  const gotAudio = await acquireCaptureStream();
  try {
    let m = await findLive();
    if (m) {
      attachMeeting(m); startStream();
      if (gotAudio) beginRecording(m.id);
      setStatus(`Mövcud canlı iclasa qoşuldu: <b>${esc(m.topic)}</b> — təzəsini istəyirsinizsə əvvəl ⏹ Bitir basın`, true);
      return;
    }
    m = await api("/api/meetings", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ topic: "Meet testi", user_name: $("name").value.trim() || null }),
    });
    m = await api(`/api/meetings/${m.id}/start`, { method: "POST" });
    attachMeeting(m); startStream();
    if (gotAudio) beginRecording(m.id);
    setStatus(gotAudio
      ? `<b>${esc(m.topic)}</b> canlıdır 🎧 — Meet sekmesinin səsi dinlənilir (yalnız qarşı tərəf, siz yox).`
      : `<b>${esc(m.topic)}</b> canlıdır, amma səs paylaşılmadı. «Bitir» edin, sonra «Başlat» basıb Meet sekmesini seçin və «Səsi də paylaş»-ı işarələyin.`, gotAudio);
  } catch (e) { setStatus("Başlatma xətası: " + esc(e.message), false); }
};

$("endBtn").onclick = async () => {
  if (!meeting) { setStatus("Bitiriləcək iclas yoxdur", false); return; }
  const id = meeting.id, topic = meeting.topic;
  stopStream();
  stopCapture();
  // shown = göstərilən tamamlanmış addım; target = son çatdırılma addımına qədər (6);
  // done olanda pacer 7-ci addımı da doldurur. Beləliklə həmişə 1→7 hamar gedir.
  postState = { id, topic, shown: 0, target: 6, total: 7, done: false, delivered: null, error: false };
  renderPost();
  setStatus(`<b>${esc(topic)}</b> bitirilir — hesabat hazırlanır…`, true);

  if (postAnim) clearInterval(postAnim);
  postAnim = startPacer(() => postState, renderPost, 780, () => {
    setTimeout(() => { if (postState && postState.topic === topic) { postState = null; renderPost(); } }, 12000);
  });

  try {
    const report = await api(`/api/meetings/${id}/end`, { method: "POST" });
    if (postState) { postState.done = true; postState.delivered = !!report.delivered; }
    meeting = null;
    items.clear(); transcript = []; quickSummary = ""; stats.startedAt = null;
    render();
    setStatus(`✅ <b>${esc(topic)}</b> bitdi, hesabat hazırdır — yenisi üçün «▶ Başlat»`, false);
  } catch (e) {
    if (postState) postState.error = true;
    renderPost();
    setStatus("Bitirmə xətası: " + esc(e.message), false);
  }
};

// Faylı bilik bazasına yükləyir (düymə + drag-and-drop) + mərhələ göstəricisi
async function uploadFile(f) {
  if (!f) { setStatus("Fayl tapılmadı", false); return; }
  const name = (f.name || "").toLowerCase();
  if (!name.endsWith(".pdf") && !name.endsWith(".txt")) {
    setStatus("Yalnız PDF və ya mətn faylı olmalıdır", false); return;
  }
  const fd = new FormData();
  fd.append("file", f);
  ingestState = { title: f.name, shown: 0, target: 1, total: 4, done: false, error: false, chunks: 0, qa: 0, doc_id: null };
  renderIngest();
  if (ingestAnim) clearInterval(ingestAnim);
  ingestAnim = startPacer(() => ingestState, renderIngest, 620, () => {
    setTimeout(() => { if (ingestState && ingestState.done) { ingestState = null; renderIngest(); } }, 6000);
  });
  setStatus(`📄 «${esc(f.name)}» yüklənir…`, true);
  try {
    const r = await api("/api/ingest/file", { method: "POST", body: fd });
    if (ingestState) { ingestState.chunks = r.chunk_count; ingestState.doc_id = r.doc_id; ingestState.target = 2; ingestState.title = r.title; }
    setStatus(`📄 «${esc(r.title)}» yükləndi — ${r.chunk_count} parça.`, true);
    pollIngest(r.doc_id);
  } catch (e) {
    if (ingestState) { ingestState.error = true; renderIngest(); }
    setStatus("Yükləmə xətası: " + esc(e.message), false);
  }
}
$("pdf").onchange = () => { if ($("pdf").files[0]) uploadFile($("pdf").files[0]); };

// Emal mərhələlərini poll edir (suallar çıxarılması arxa planda gedir) — yalnız
// target/done yeniləyir; addımları pacer bir-bir doldurur (tullanma olmur).
async function pollIngest(docId) {
  for (let i = 0; i < 40; i++) {
    await sleep(700);
    if (!ingestState || ingestState.doc_id !== docId) return;  // yeni yükləmə başlayıb
    let s;
    try { s = await api(`/api/ingest/status/${docId}`); } catch (_) { break; }
    if (s.qa != null) ingestState.qa = s.qa;
    if (s.chunks) ingestState.chunks = s.chunks;
    const stg = s.stage;
    if (stg === "error") { ingestState.error = true; renderIngest(); return; }
    if (stg === "done" || s.done) {
      ingestState.done = true;
      if (ingestState.title && !ingestedDocs.includes(ingestState.title)) ingestedDocs.push(ingestState.title);
      renderIngest();
      return;
    }
    ingestState.target = (stg === "extracted") ? 3 : Math.max(ingestState.target, 2);
    renderIngest();
  }
}

const _INGEST_STEPS = ["Yüklənir…", "Bazaya yazılır…", "Ehtimal suallar çıxarılır…", "Yaddaşa yazılır…"];
function renderIngest() {
  const el = $("ingest");
  if (!el) return;
  if (!ingestState) {
    // Davamlı təsdiq: yüklənmiş sənədlər bilik bazasındadır (native "fayl seçilmədi" mətnini əvəz edir)
    el.innerHTML = ingestedDocs.length
      ? `<div class="kbchip">✅ Bilik bazası: ${ingestedDocs.map(esc).join(", ")}</div>` : "";
    return;
  }
  const s = ingestState, qa = s.qa || 0, shown = s.shown || 0;
  const finished = s.done && shown >= 4 && !s.error;
  const pct = finished ? 100 : Math.round(Math.min(shown, 4) / 4 * 100);
  const cur = _INGEST_STEPS[Math.min(shown, _INGEST_STEPS.length - 1)] || "Emal olunur…";
  const cls = s.error ? "err" : finished ? "ok" : "";
  const title = s.error ? `📄 «${esc(s.title)}» — emal alınmadı`
    : finished ? `✅ «${esc(s.title)}» hazırdır`
    : `📄 «${esc(s.title)}» emal olunur…`;
  const sub = s.error ? "Mətn çıxarıla bilmədi"
    : finished ? (qa > 0 ? `${qa} ehtimal sual hazırlandı` : "cavablar buna əsaslanacaq")
    : cur;
  el.innerHTML = `<div class="progress ${cls}"><div class="pring" data-p="${pct}" style="--p:${pct}"></div>` +
    `<div class="pinfo"><div class="pt">${title}</div><div class="ps">${esc(sub)}</div></div></div>`;
}

/* --- İclas-sonrası pipeline stepper («Bitir») --- */
const _POST_ORDER = ["ended", "assembled", "summarized", "actions", "memorized", "card", "done"];
const _POST_STEPS = [
  "İclas bitirildi",
  "Transkript yığıldı",
  "Xülasə hazırlandı",
  "Tapşırıqlar çıxarıldı",
  "Yaddaşa yazıldı",
  "Xülasə kartı yaradıldı",
  "Email + Telegram-a göndərildi",
];
function renderPost() {
  const el = $("postbar");
  if (!el) return;
  if (!postState) { el.innerHTML = ""; return; }
  const s = postState;
  const shown = s.shown || 0;
  const finished = s.done && shown >= 7 && !s.error;
  const deliverFail = finished && s.delivered === false;
  const pct = finished ? 100 : Math.round(Math.min(shown, 7) / 7 * 100);
  const cur = _POST_STEPS[Math.min(shown, _POST_STEPS.length - 1)] || "Hazırlanır…";
  const cls = (s.error || deliverFail) ? "err" : finished ? "ok" : "";
  const title = s.error ? "⚠️ Hesabat emalında xəta"
    : deliverFail ? "🧾 Hesabat hazır — çatdırılma alınmadı"
    : finished ? "✅ Hesabat hazır və çatdırıldı"
    : "🧾 Hesabat hazırlanır…";
  const sub = s.error ? "Yenidən cəhd edin"
    : deliverFail ? "email/Telegram göndərilmədi"
    : finished ? "email · Telegram"
    : cur;
  const link = (finished && s.id)
    ? `<button class="hback" data-report="${s.id}" data-topic="${esc(s.topic)}">Hesabata bax →</button>` : "";
  el.innerHTML = `<div class="progress ${cls}"><div class="pring" data-p="${pct}" style="--p:${pct}"></div>` +
    `<div class="pinfo"><div class="pt">${title}</div><div class="ps">${esc(sub)}</div>${link}</div></div>`;
  const lk = el.querySelector("[data-report]");
  if (lk) lk.onclick = () => { historyOpen = true; openReport(lk.dataset.report, lk.dataset.topic); };
}

/* --- Masaüstü bildiriş (yalnız sizə ünvanlanan suallar) --- */
function updateNotifyBtn() {
  const b = $("notifyBtn");
  if (!b) return;
  b.classList.toggle("on", notifyOn);
  b.title = notifyOn ? "Bildiriş açıqdır — sizə sual veriləndə xəbər verir"
                     : "Bildiriş: sizə sual veriləndə xəbər verir";
}
function maybeNotify(q) {
  if (!notifyOn || !("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const n = new Notification("🔔 Sizə sual verildi", { body: q, tag: "mai-q", renotify: true });
    n.onclick = () => { window.focus(); n.close(); };
  } catch (_) { /* bildiriş alınmadı */ }
}
$("notifyBtn").onclick = async () => {
  if (!("Notification" in window)) { setStatus("Bu brauzer bildiriş dəstəkləmir", false); return; }
  if (!notifyOn) {
    let perm = Notification.permission;
    if (perm !== "granted") perm = await Notification.requestPermission();
    if (perm === "granted") {
      notifyOn = true; localStorage.setItem("notify", "on");
      setStatus("🔔 Bildiriş açıldı — sizə sual veriləndə xəbər verəcək", true);
    } else { setStatus("Bildiriş icazəsi verilmədi", false); }
  } else {
    notifyOn = false; localStorage.setItem("notify", "off");
    setStatus("Bildiriş söndürüldü", false);
  }
  updateNotifyBtn();
};
updateNotifyBtn();

$("historyBtn").onclick = () => {
  historyOpen = true; historyDetail = null; historySearch = "";
  renderHistory(); loadHistory();
};

async function loadHistory() {
  try {
    const list = await api("/api/meetings");
    historyList = list.filter((m) => m.status === "ended")
                      .sort((a, b) => String(b.ended_at || "").localeCompare(String(a.ended_at || "")));
  } catch (_) { historyList = []; }
  renderHistory();
}

async function openReport(id, topic) {
  historyDetail = { id, topic, loading: true };
  renderHistory();
  try { historyDetail = { id, topic, report: await api(`/api/meetings/${id}/report`) }; }
  catch (e) { historyDetail = { id, topic, error: e.message }; }
  renderHistory();
}

const _aiKey = (mid, i) => `ai:${mid}:${i}`;
function toggleAI(mid, i) {
  const k = _aiKey(mid, i);
  if (localStorage.getItem(k) === "1") localStorage.removeItem(k); else localStorage.setItem(k, "1");
  renderHistory();
}

const _AZ_MONTHS = ["yanvar", "fevral", "mart", "aprel", "may", "iyun",
                    "iyul", "avqust", "sentyabr", "oktyabr", "noyabr", "dekabr"];
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).slice(0, 16).replace("T", " ");
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getDate()} ${_AZ_MONTHS[d.getMonth()]}, ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderHistory() {
  const el = $("history");
  if (!el) return;
  if (!historyOpen) { el.innerHTML = ""; return; }

  let inner;
  if (historyDetail) {
    const d = historyDetail;
    let body;
    if (d.loading) body = `<div class="hempty"><span class="spin"></span> Hesabat yüklənir…</div>`;
    else if (d.error) body = `<div class="hempty">Hesabat yüklənə bilmədi: ${esc(d.error)}</div>`;
    else {
      const r = d.report, s = r.summary || {};
      const kp = (s.key_points || []).map((p) => `<li>${esc(p)}</li>`).join("");
      const ai = (r.action_items || []).map((a, i) => {
        const done = localStorage.getItem(_aiKey(d.id, i)) === "1";
        const owner = a.owner ? `<span class="owner">${esc(a.owner)}</span>` : "";
        const due = a.due ? `<span class="due">${esc(a.due)}</span>` : "";
        return `<div class="ai ${done ? "done" : ""}" data-i="${i}"><span class="box">✓</span>` +
               `<div><div class="task">${esc(a.task)}</div>` +
               (owner || due ? `<div class="meta">${owner}${due}</div>` : "") + `</div></div>`;
      }).join("") || `<div class="hempty" style="padding:14px">Tapşırıq tapılmadı.</div>`;
      body =
        `<button class="hback" id="hBack">← Siyahıya qayıt</button>` +
        `<div class="hsec"><div class="headline">${esc(s.headline || d.topic)}</div>` +
          `<div class="overview">${esc(s.overview || "")}</div></div>` +
        (kp ? `<div class="hsec"><h3>Əsas məqamlar</h3><ul>${kp}</ul></div>` : "") +
        `<div class="hsec"><h3>Tapşırıqlar</h3>${ai}</div>` +
        `<div class="hsec"><h3>Transkript</h3><div class="htx">${esc(r.transcript || "(boş)")}</div></div>`;
    }
    inner =
      `<div class="hist-head"><h2>🧾 ${esc(d.topic)}</h2>` +
      `<button class="hist-x" id="hClose" aria-label="Bağla">✕</button></div>` +
      `<div class="hist-body">${body}</div>`;
  } else {
    const q = historySearch.trim().toLowerCase();
    const filtered = q ? historyList.filter((m) => String(m.topic || "").toLowerCase().includes(q)) : historyList;
    const rows = filtered.length
      ? filtered.map((m) =>
          `<div class="hrow" data-id="${m.id}" data-topic="${esc(m.topic)}">` +
          `<div><div class="ht">${esc(m.topic)}</div><div class="hm">${esc(fmtDate(m.ended_at || m.started_at))}</div></div>` +
          `<span class="hchev">›</span></div>`).join("")
      : `<div class="hempty">${historyList.length ? "Uyğun iclas tapılmadı." : "Hələ bitmiş iclas yoxdur.<br>İclas keçirib «Bitir» basandan sonra burada görünəcək."}</div>`;
    inner =
      `<div class="hist-head"><h2>🗂 İclas tarixçəsi</h2>` +
      `<input type="text" id="hSearch" placeholder="Mövzuya görə axtar…" value="${esc(historySearch)}">` +
      `<button class="hist-x" id="hClose" aria-label="Bağla">✕</button></div>` +
      `<div class="hist-body">${rows}</div>`;
  }
  el.innerHTML = `<div class="hist-ov" id="histOv"><div class="hist-card">${inner}</div></div>`;

  const close = () => { historyOpen = false; historyDetail = null; renderHistory(); };
  if ($("hClose")) $("hClose").onclick = close;
  const ov = $("histOv");
  if (ov) ov.onclick = (e) => { if (e.target === ov) close(); };
  if ($("hBack")) $("hBack").onclick = () => { historyDetail = null; renderHistory(); };
  const search = $("hSearch");
  if (search) {
    search.oninput = () => { historySearch = search.value; renderHistory(); };
    const v = search.value; search.focus(); search.value = ""; search.value = v;
  }
  el.querySelectorAll(".hrow").forEach((row) => {
    row.onclick = () => openReport(row.dataset.id, row.dataset.topic);
  });
  el.querySelectorAll(".ai").forEach((a) => {
    a.onclick = () => toggleAI(historyDetail.id, parseInt(a.dataset.i, 10));
  });
}

/* Drag-and-drop: sənədi panelə at */
(function initDropzone() {
  const dz = $("dropzone"); let depth = 0;
  const hasFiles = (e) => e.dataTransfer && [...(e.dataTransfer.types || [])].includes("Files");
  window.addEventListener("dragenter", (e) => { if (hasFiles(e)) { e.preventDefault(); depth++; dz.classList.add("on"); } });
  window.addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; dz.classList.remove("on"); } });
  window.addEventListener("drop", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); depth = 0; dz.classList.remove("on");
    const f = e.dataTransfer.files[0];
    if (f) uploadFile(f);
  });
})();

// ③ Yumşaq ad uyğunluğu: STT adı bir az səhv yazsa da tutur (Samir/Samirə/Samil)
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function isDirected(p) {
  if (p.directed_to_user) return true;
  const name = norm($("name").value);
  if (name.length < 2) return false;
  const q = norm(p.question);
  if (q.includes(name)) return true;
  const stem = name.slice(0, Math.max(4, name.length - 1));
  const tol = name.length <= 5 ? 1 : 2;
  for (const w of q.split(/[^\p{L}]+/u)) {
    if (w.length < 3) continue;
    if (w.startsWith(stem) || (stem.startsWith(w) && w.length >= 4)) return true;
    if (lev(w, name) <= tol) return true;
  }
  return false;
}

// Bir feed hadisəsini emal edir. lastId ilə dublikatı atır. true = dəyişiklik oldu.
function handleEvent(e) {
  if (!e || e.id <= lastId) return false;
  lastId = e.id;
  const p = e.payload || {};
  if (e.type === "segment") {
    lastHeard = p.text || lastHeard;
    stats.segments += 1;
    if (p.text) { transcript.push({ text: p.text }); if (transcript.length > 60) transcript.shift(); }
  } else if (e.type === "question") {
    stats.questions += 1;
    const directed = isDirected(p);
    if (directed) stats.directed += 1;
    const k = norm(p.question);
    if (!items.has(k)) {
      items.set(k, { q: p.question, urgency: p.urgency, directed, answers: [],
                     ready: false, t0: Date.now(), elapsed: null });
      if (directed) maybeNotify(p.question);  // masaüstü bildiriş (yalnız sizə ünvanlı)
    }
  } else if (e.type === "answer") {
    const it = items.get(norm(p.question));
    if (it) {
      it.streamText = p.text || ""; it.done = !!p.done;
      it.based_on_context = p.based_on_context; it.source = p.source || null;
      it.prepared = !!p.prepared; it.ready = true;
      if (it.done && it.elapsed == null && it.t0) it.elapsed = (Date.now() - it.t0) / 1000;
    }
  } else if (e.type === "answer_options") {
    const it = items.get(norm(p.question));
    if (it) {
      it.answers = p.options || []; it.ready = true;
      if (it.elapsed == null && it.t0) it.elapsed = (Date.now() - it.t0) / 1000;
    }
  } else if (e.type === "quick_summary") {
    quickSummary = p.summary || quickSummary;
  }
  return true;
}

  setStatus(`<b>${esc(meeting.topic)}</b> dinlənilir${heard}`, true);
}

/* --- SSE (streaming) --- */
// SSE axını fetch ilə oxunur (EventSource Authorization başlığı göndərə bilmir —
// prod-da giriş açıq olduğu üçün EventSource 401 alırdı; fetch token-i göndərir).
let es = null;   // aktiv axının AbortController-i
function stopStream() { if (es) { try { es.abort(); } catch (_) {} es = null; } }
async function startStream() {
  stopStream();
  if (!meeting) return;
  const ctrl = new AbortController();
  es = ctrl;
  const id = meeting.id;
  try {
    const r = await fetch(`/api/meetings/${id}/stream?after_id=${lastId}`, {
      headers: token ? { "Authorization": "Bearer " + token } : {},
      signal: ctrl.signal,
    });
    if (!r.ok || !r.body) { if (es === ctrl) es = null; return; }  // uğursuz → polling ehtiyatı
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (es !== ctrl || !meeting || meeting.id !== id) break;  // dayandırılıb
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {          // SSE hadisələri "\n\n" ilə ayrılır
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const line = block.split("\n").find((l) => l.startsWith("data:"));
        if (!line) continue;
        try {
          if (handleEvent(JSON.parse(line.slice(5).trim()))) render();
          statusLine();
        } catch (_) { /* pozuq hadisə */ }
      }
    }
  } catch (_) { /* şəbəkə/abort — polling davam edir */ }
  if (es === ctrl) es = null;   // axın bitdi → poll() feed-polling ehtiyatına keçir
}

/* --- Polling: SSE ehtiyatı + iclasa qoşulma --- */
async function poll() {
  try {
    if (!meeting) {
      const m = await findLive();
      if (m) { attachMeeting(m); startStream(); }
    }
    if (!meeting) { setStatus("Canlı iclas yoxdur — «▶ Başlat» basın", false); return; }
    if (es) { statusLine(); return; }
    const events = await api(`/api/meetings/${meeting.id}/feed?after_id=${lastId}`);
    let changed = false;
    for (const e of events) if (handleEvent(e)) changed = true;
    statusLine();
    if (changed) render();
  } catch (e) {
    if (String(e.message).includes("tapılmadı")) { meeting = null; stopStream(); stopCapture(); render(); }
    setStatus("Server gözlənilir… (" + esc(e.message) + ")", false);
  }
}
render();          // başlanğıcda sakit qarşılama (idle) göstərilir
setInterval(poll, 2000);
poll();

/* --- Render --- */
function fmtTime() {
  if (!stats.startedAt) return "0:00";
  const s = Math.floor((Date.now() - stats.startedAt) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function cardHtml(it) {
  const answered = (it.streamText != null && it.done) ||
                   (it.ready && it.answers && it.answers.length > 0);
  let answers;
  if (it.streamText != null) {
    // Axan tək cavab. J: hazır cavab ani gəlir; D: mənbə çipi.
    const chip = it.prepared
      ? `<span class="ctx ready">📚 öncədən hazırlanmış cavab</span>`
      : (it.based_on_context
          ? `<span class="ctx">📚 ${esc(it.source || "sənədə əsaslanır")}</span>` : "");
    answers =
      `<div class="opt stream" data-text="${esc(it.streamText)}">` +
      esc(it.streamText) + (it.done ? "" : `<span class="cursor"></span>`) + chip + `</div>`;
  } else if (it.ready && it.answers.length) {
    answers = it.answers.map((o) =>
      `<div class="opt" data-text="${esc(o.text)}">` +
      `<span class="tone">${esc(o.tone)}</span>${esc(o.text)}` +
      (o.based_on_context ? `<span class="ctx">📚 sənədə əsaslanır</span>` : "") +
      `</div>`).join("");
  } else {
    answers = `<div class="wait"><span class="spin"></span>Cavab hazırlanır…</div>`;
  }
  // F: sürət nişanı
  let badge = "";
  if (it.prepared) badge = ` <span class="spd">⚡ ani</span>`;
  else if (it.elapsed != null && it.elapsed >= 0.3 && it.elapsed < 120)
    badge = ` <span class="spd">⚡ ${it.elapsed.toFixed(1)}s</span>`;
  // I: status axını
  const timeline =
    `<div class="tl">` +
    `<span class="st done">aşkarlandı</span>` +
    `<span class="st ${answered ? "done" : "active"}">cavablanır</span>` +
    `<span class="st ${answered ? "done" : ""}">hazır${answered ? badge : ""}</span>` +
    `</div>`;
  // Güvən halqası: cavabın sənədlərinizə əsaslanma gücü (real siqnallardan)
  let conf = null;
  if (answered) {
    const grounded = it.based_on_context || (it.answers && it.answers.some((a) => a.based_on_context));
    conf = it.prepared ? 92 : (grounded ? 80 : 64);
  }
  const confHtml = conf != null
    ? `<div class="conf" data-p="${conf}" style="--p:${conf}" title="Cavabın sənədlərinizə əsaslanma gücü"></div>`
    : "";
  const cls = (it.directed ? "q urgent" : "q plain") + (conf != null ? " hasconf" : "");
  const tag = it.directed
    ? `Sizə sual<span class="b">${it.urgency === "yüksək" ? "təcili" : "sizə ünvanlanıb"}</span>`
    : "İclasda sual";
  return `<div class="${cls}">${confHtml}<div class="tag">${tag}</div>` +
    `<div class="qt">${esc(it.q)}</div>` + timeline + answers + `</div>`;
}

function render() {
  const stack = $("stack") || pipDoc?.getElementById("stack");
  if (!stack) return;

  // İdle (iclas getmir) — sakit qarşılama, «Dinləyirəm» yox
  if (!meeting) {
    setLive(false);
    stack.innerHTML =
      `<div class="welcome"><div class="worb"></div>` +
      `<div class="wh">Başlamağa hazıram</div>` +
      `<div class="wp">«▶ İclası başlat» basın — iclas səsi, aşkarlanan suallar və hazır cavablar burada canlı görünəcək.</div></div>`;
    return;
  }

  // Canlı zolaq
  const livebar =
    `<div class="livebar">` +
      `<span class="live">CANLI</span>` +
      `<span class="meta"><i>⏱</i><b id="tmr">${fmtTime()}</b></span>` +
      `<span class="meta">Sual <b>${stats.questions}</b></span>` +
      `<span class="meta hot">Sizə <b>${stats.directed}</b></span>` +
      `<button class="sum-btn" id="cmuBtn">📋 Söhbətin gedişatı</button>` +
    `</div>`;

  // Sol sütun: canlı transkript
  const tlines = transcript.length
    ? transcript.map((t, i) =>
        `<div class="tline${i === transcript.length - 1 ? " now" : ""}">${esc(t.text)}</div>`).join("")
    : `<div class="thint">Səs eşidiləndə söylənənlər burada canlı axacaq…</div>`;
  const transcriptCol =
    `<section class="col transcript-col">` +
      `<div class="colhead"><span class="ico">🎙</span>Canlı transkript<span class="cnt">${stats.segments}</span></div>` +
      `<div class="tbody" id="tbody">${tlines}</div>` +
    `</section>`;

  // Sağ sütun: suallar/cavablar
  // Ən son verilən sual HƏMİŞƏ yuxarıda olur (xronoloji, yenidən köhnəyə).
  // Əvvəllər ünvanlı suallar zorla yuxarı qaldırılırdı — bu, yeni sualı 2-3-cü
  // sıraya salırdı. İndi ünvanlı suallar yalnız qırmızı vurğu + «sizə» nişanı
  // ilə seçilir, sıranı pozmur. «Sizə» rejimi yalnız ünvanlıları süzür.
  const all = Array.from(items.values()).reverse();
  const ordered = answerMode === "directed"
    ? all.filter((it) => it.directed)
    : all;
  const cards = ordered.length
    ? ordered.map(cardHtml).join("")
    : `<div class="listening"><div class="earpulse"></div>` +
      `<div class="lt">Dinləyirəm<span class="dots"><i></i><i></i><i></i></span></div>` +
      `<div class="ls">İclasda sual veriləndə cavab burada dərhal görünəcək.</div></div>`;
  const qaCol =
    `<section class="col qa-col">` +
      `<div class="colhead"><span class="ico">💬</span>Suallar və cavablar<span class="cnt">${stats.questions}</span></div>` +
      `<div class="qbody">${cards}</div>` +
    `</section>`;

  // Şüşə xülasə örtüyü (düymə ilə açılır)
  const glass = cmuVisible
    ? `<div class="glass-ov" id="glassOv"><div class="glass-card">` +
        `<div class="gc-head"><span>📋 Söhbətin gedişatı</span>` +
          `<button class="gc-x" id="cmuClose" aria-label="Bağla">✕</button></div>` +
        `<div class="gc-body">${esc(quickSummary || "Hələ xülasə yaranmayıb — söhbət davam etdikcə hər bir neçə seqmentdən bir yenilənəcək.")}</div>` +
        `<div class="gc-foot">Diqqətinizi itirsəniz, indiyə qədər nə danışıldığını bir baxışda göstərir.</div>` +
      `</div></div>`
    : "";

  // Dynamic Island: cari (ən son aşkarlanan) sual kapsulu
  const _arr = Array.from(items.values());
  const focus = _arr[_arr.length - 1];
  const island = focus
    ? `<div class="island"><span class="o"></span><span class="q">${esc(focus.q)}</span>` +
      (focus.directed ? `<span class="b you">Sizə</span>` : `<span class="b live">Canlı</span>`) + `</div>`
    : "";

  stack.innerHTML = island + livebar + `<div class="grid2">` + transcriptCol + qaCol + `</div>` + glass;

  // Transkripti sona sürüşdür (ən son sətir görünsün)
  const tb = stack.querySelector("#tbody");
  if (tb) tb.scrollTop = tb.scrollHeight;

  // Klik-kopyala
  stack.querySelectorAll(".opt").forEach((el) => {
    el.onclick = () => {
      navigator.clipboard?.writeText(el.dataset.text).catch(() => {});
      el.classList.add("copied");
      setTimeout(() => el.classList.remove("copied"), 1200);
    };
  });
  // Şüşə örtük idarəsi
  const doc = stack.ownerDocument;
  const cmuBtn = doc.getElementById("cmuBtn");
  if (cmuBtn) cmuBtn.onclick = () => { cmuVisible = !cmuVisible; render(); };
  const cmuClose = doc.getElementById("cmuClose");
  if (cmuClose) cmuClose.onclick = () => { cmuVisible = false; render(); };
  const glassOv = doc.getElementById("glassOv");
  if (glassOv) glassOv.onclick = (ev) => { if (ev.target === glassOv) { cmuVisible = false; render(); } };
}
render();

// Taymer: hər saniyə YALNIZ rəqəm yenilənir
setInterval(() => {
  const el = document.getElementById("tmr") || pipDoc?.getElementById("tmr");
  if (el && stats.startedAt) el.textContent = fmtTime();
}, 1000);

/* --- Picture-in-Picture --- */
let pipDoc = null;
$("pipBtn").onclick = async () => {
  const stack = $("stack");
  if (!stack) return;  // artıq PiP-dədir
  try {
    if (!("documentPictureInPicture" in window)) throw new Error("PiP dəstəklənmir");
    const pip = await documentPictureInPicture.requestWindow({ width: 420, height: 620 });
    copyStyles(pip.document);
    pip.document.body.style.cssText =
      "margin:10px;background:#070b1a;font-family:-apple-system,sans-serif;";
    pip.document.body.appendChild(stack);
    pipDoc = pip.document;
    pip.addEventListener("pagehide", () => { document.body.appendChild(stack); pipDoc = null; render(); });
    render();
  } catch (e) {
    try {
      const w = window.open("", "mai", "width=430,height=640");
      if (!w) throw e;
      w.document.write("<title>Meet Köməkçisi</title>");
      copyStyles(w.document);
      w.document.body.style.cssText = "margin:10px;background:#070b1a;";
      w.document.body.appendChild(stack);
      pipDoc = w.document;
      w.addEventListener("unload", () => { document.body.appendChild(stack); pipDoc = null; render(); });
      render();
    } catch (_) {
      setStatus("PiP açıla bilmədi (" + esc(e.message) + ") — düyməni bir də basın", false);
    }
  }
};

function copyStyles(doc) {
  document.querySelectorAll("style").forEach((s) => {
    const st = doc.createElement("style");
    st.textContent = s.textContent;
    doc.head.appendChild(st);
  });
}
</script>
</body>
</html>
