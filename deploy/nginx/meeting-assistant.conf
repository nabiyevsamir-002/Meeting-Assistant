# nginx reverse proxy konfiqurasiyası — visualkey.az
# api.visualkey.az  -> FastAPI (app:8000)
# n8n.visualkey.az  -> n8n (n8n:5678)

# HTTP -> HTTPS yönləndirmə + certbot challenge
server {
    listen 80;
    server_name api.visualkey.az n8n.visualkey.az;

    # Let's Encrypt domen təsdiqi üçün
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Əsas API (FastAPI)
server {
    listen 443 ssl;
    server_name api.visualkey.az;

    ssl_certificate     /etc/letsencrypt/live/api.visualkey.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.visualkey.az/privkey.pem;

    # Audio yükləmələri üçün limit artırılır
    client_max_body_size 50m;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uzun STT/LLM sorğuları üçün timeout
        proxy_read_timeout 300s;
    }
}

# n8n (ayrıca subdomain)
server {
    listen 443 ssl;
    server_name n8n.visualkey.az;

    ssl_certificate     /etc/letsencrypt/live/api.visualkey.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.visualkey.az/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # n8n UI websocket istifadə edir
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}
